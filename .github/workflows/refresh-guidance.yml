name: refresh guidance
on:
  schedule:
    - cron: "0 11 * * *"   # daily, 11:00 UTC (6 AM Central)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch, diff, snapshot
        run: python3 scripts/refresh_guidance.py
      - name: commit changes
        run: |
          git config user.name "optimize-button refresh"
          git config user.email "refresh@users.noreply.github.com"
          git add guidance/
          git diff --cached --quiet && echo "no changes" || (git commit -m "guidance: daily snapshot $(date -u +%F)" && git push)
